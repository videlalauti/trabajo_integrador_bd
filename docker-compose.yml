services:
  db:
    image: postgres:14
    container_name: bodegas_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secreto_super_seguro}
      POSTGRES_DB: bodegas_del_atuel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: