
name: bodegas-atuel-fase6

services:

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: bodegas_fase6_docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FASE6_PG_ADMIN_PASSWORD:?Falta configurar la clave de PostgreSQL}
      FASE6_API_PASSWORD: ${FASE6_API_PASSWORD:?Falta configurar la clave de la API}
    ports:
      - "127.0.0.1:${FASE6_DB_HOST_PORT:-55438}:5432"
    volumes:
      - postgres18_fase6_data:/var/lib/postgresql
      - ./fase6/docker/01_inicializar_postgres.sh:/docker-entrypoint-initdb.d/01_inicializar_postgres.sh:ro
      - ./fase6/docker/00_roles.sql:/bootstrap/00_roles.sql:ro
      - ./db/migrations/008_indices.sql:/bootstrap/008_indices.sql:ro
      - ./db/seed/dump_completo.sql.gz:/bootstrap/dump_completo.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bodegas_fase6_docker"]
      interval: 5s
      timeout: 3s
      retries: 15



  api:
    build:
      context: ./api
    image: bodegas-atuel-api:fase6
    ports:
      - "127.0.0.1:${FASE6_API_HOST_PORT:-8001}:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bodegas_fase6_docker
      DB_USER: bodega_api
      DB_PASSWORD: ${FASE6_API_PASSWORD:?Falta configurar la clave de la API}
      DB_POOL_MIN: "1"
      DB_POOL_MAX: "5"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres18_fase6_data:
